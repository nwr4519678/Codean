# Default values for the platform umbrella chart.
# Overridden by values-dev.yaml / values-staging.yaml / values-prod.yaml.

image:
  registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com/platform
  pullPolicy: IfNotPresent
  tag: latest

api:
  enabled: true
  replicas: 3
  minReplicas: 3
  maxReplicas: 50
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "1Gi"  }

worker:
  enabled: true
  replicas: 2
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

judge:
  enabled: true
  replicas: 2
  minReplicas: 2
  maxReplicas: 100
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2",    memory: "4Gi" }

web:
  enabled: true
  replicas: 3
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.platform.local
      paths: ["/"]
      service: platform-api
      port: 80
    - host: app.platform.local
      paths: ["/"]
      service: platform-web
      port: 80

secrets:
  externalSecrets:
    enabled: true
    refreshInterval: 5m
    secretStoreName: aws-secrets

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s

networkPolicy:
  enabled: true
