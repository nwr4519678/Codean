# Network policies: strict default-deny with explicit allows.
# Combined with the ALB ingress above, pods are not reachable from outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
  namespace: platform
spec:
  podSelector: { matchLabels: { app: platform-api } }
  policyTypes: [Egress]
  egress:
    # DNS
    - to: [{ namespaceSelector: {} }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    # Postgres
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
      ports: [{ protocol: TCP, port: 5432 }]
    # Redis
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
      ports: [{ protocol: TCP, port: 6379 }]
    # OpenSearch
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
      ports: [{ protocol: TCP, port: 9200 }]
    # Paymob + Google + MS Graph + R2 (HTTPS out)
    - to: [{}]
      ports: [{ protocol: TCP, port: 443 }]
    # Hangfire PG (same as data namespace)
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress-from-alb
  namespace: platform
spec:
  podSelector: { matchLabels: { app: platform-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { name: ingress } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-egress
  namespace: platform
spec:
  podSelector: { matchLabels: { app: platform-worker } }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: {} }]   # DNS
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
      ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 6379 }]
    - to: [{}]
      ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 25 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-judge-from-api
  namespace: platform
spec:
  podSelector: { matchLabels: { app: platform-judge } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: platform-api } }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ namespaceSelector: {} }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress-from-alb
  namespace: platform
spec:
  podSelector: { matchLabels: { app: platform-web } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { name: ingress } }
      ports: [{ protocol: TCP, port: 3000 }]
  egress:
    - to: [{ namespaceSelector: {} }]   # DNS
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{}]
      ports: [{ protocol: TCP, port: 443 }]   # fonts, images, etc.
