apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-web
  namespace: platform
  labels: { app: platform-web, app.kubernetes.io/component: web }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: platform-web }
  template:
    metadata:
      labels: { app: platform-web }
    spec:
      serviceAccountName: platform-web
      containers:
        - name: web
          image: REPLACE_ME_ECR/platform/web:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 3000, name: http }]
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: https://api.platform.app
            - name: NEXT_PUBLIC_WS_URL
              value: wss://api.platform.app/hubs
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: platform-web
  namespace: platform
spec:
  selector: { app: platform-web }
  ports: [{ name: http, port: 80, targetPort: 3000 }]
