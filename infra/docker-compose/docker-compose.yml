# Local development stack for the Platform monorepo.
# Brings up: Postgres, Redis, OpenSearch, MinIO (R2 substitute), MailHog,
# API, Judge, and the Web app.
#
# Usage:
#   docker compose -f infra/docker-compose/docker-compose.yml up -d
#   docker compose -f infra/docker-compose/docker-compose.yml logs -f api
#   docker compose -f infra/docker-compose/docker-compose.yml down -v

x-platform-base: &platform-base
  platform: linux/amd64
  restart: unless-stopped
  env_file:
    - path: .env.local
      required: false

services:
  postgres:
    <<: *platform-base
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    <<: *platform-base
    image: redis:7-alpine
    container_name: platform-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  opensearch:
    <<: *platform-base
    image: opensearchproject/opensearch:2.18.0
    container_name: platform-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    <<: *platform-base
    image: minio/minio:latest
    container_name: platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  mailhog:
    <<: *platform-base
    image: mailhog/mailhog:latest
    container_name: platform-mailhog
    ports: ["1025:1025", "8025:8025"]

  api:
    <<: *platform-base
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.runtime
      args: { PROJECT: Platform.Api }
    container_name: platform-api
    depends_on:
      postgres:    { condition: service_healthy }
      redis:       { condition: service_healthy }
      opensearch:  { condition: service_healthy }
      minio:       { condition: service_started }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RUN_MIGRATIONS: "true"
      ConnectionStrings__Postgres: Host=postgres;Database=platform;Username=platform;Password=platform
      Redis__Configuration: redis:6379
      Elasticsearch__Url: http://opensearch:9200
      CloudflareR2__AccountId: minio
      CloudflareR2__AccessKey: minio
      CloudflareR2__SecretKey: minio12345
      CloudflareR2__Bucket: platform
      CloudflareR2__PublicBaseUrl: http://localhost:9000/platform
      Paymob__BaseUrl: https://accept.paymob.com
      Paymob__ApiKey: ${PAYMOB_API_KEY:-test}
      Paymob__HmacSecret: ${PAYMOB_HMAC:-test}
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      Smtp__UseSsl: "false"
      Smtp__Username: ""
      Smtp__Password: ""
      Smtp__FromAddress: no-reply@platform.local
      Jwt__Issuer: platform
      Jwt__Audience: platform
      Jwt__Secret: local-development-only-change-me
    ports: ["8080:8080"]

  judge:
    <<: *platform-base
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.runtime
      args: { PROJECT: Platform.Judge }
    container_name: platform-judge
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=platform;Username=platform;Password=platform
      ASPNETCORE_ENVIRONMENT: Development
    ports: ["8081:8080"]

  web:
    <<: *platform-base
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_URL: http://localhost:8080
    container_name: platform-web
    depends_on: [api]
    ports: ["3000:80"]

volumes:
  pgdata:
  redisdata:
  osdata:
  miniodata:
