name: frontend-ci

on:
  push:
    branches: [main, develop]
    paths: [frontend/**, .github/workflows/frontend-ci.yml]
  pull_request:
    paths: [frontend/**, .github/workflows/frontend-ci.yml]

jobs:
  verify:
    name: typecheck-and-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck active apps and libraries
        run: |
          pnpm --filter @codean/web typecheck
          pnpm --filter @codean/admin typecheck
          pnpm --filter @platform/api typecheck
          pnpm --filter @platform/contracts typecheck
          pnpm --filter @platform/config typecheck
          pnpm --filter @platform/ui typecheck
      - name: Build active apps
        run: |
          pnpm --filter @codean/web build
          pnpm --filter @codean/admin build
