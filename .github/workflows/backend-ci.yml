name: backend-ci

on:
  push:
    branches: [main, develop]
    paths: [backend/**, .github/workflows/backend-ci.yml]
  pull_request:
    paths: [backend/**, .github/workflows/backend-ci.yml]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore backend/Platform.slnx

      - name: Build
        run: dotnet build backend/Platform.slnx -c Release --no-restore /p:TreatWarningsAsErrors=false

  test-unit:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: ${{ env.DOTNET_VERSION }} }
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
      - name: Run unit tests
        run: |
          dotnet test backend/tests/Platform.Domain.UnitTests/Platform.Domain.UnitTests.csproj \
            --no-restore -c Release --logger "trx;LogFileName=domain.trx" \
            --collect:"XPlat Code Coverage" --results-directory ./coverage
          dotnet test backend/tests/Platform.Application.UnitTests/Platform.Application.UnitTests.csproj \
            --no-restore -c Release --logger "trx;LogFileName=application.trx" \
            --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          flags: unittests
          fail_ci_if_error: false

  test-integration:
    name: integration-tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: ${{ env.DOTNET_VERSION }} }
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
      - name: Run integration tests
        env:
          ConnectionStrings__Postgres: Host=localhost;Database=platform_test;Username=platform;Password=platform
          Redis__Configuration: localhost:6379
        run: dotnet test backend/tests/Platform.Infrastructure.IntegrationTests/Platform.Infrastructure.IntegrationTests.csproj -c Release --no-build --no-restore

  architecture-tests:
    name: architecture-tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: ${{ env.DOTNET_VERSION }} }
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
      - name: Verify Clean Architecture rules
        run: dotnet test backend/tests/Platform.ArchitectureTests/Platform.ArchitectureTests.csproj -c Release --no-build --no-restore

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: backend
          format: sarif
          output: trivy-backend.sarif
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
